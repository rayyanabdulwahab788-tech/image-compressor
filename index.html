<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salphaa Image Compressor</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        .container { max-width: 500px; margin: auto; padding: 20px; border: 1px solid #ccc; border-radius: 10px; }
        input, button { margin: 10px 0; padding: 10px; width: 100%; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        img { max-width: 100%; margin-top: 20px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Image Compressor Salphaa</h2>
    
    <!-- Suuraa Galchuu -->
    <input type="file" id="uploadImage" accept="image/jpeg, image/png">
    
    <!-- Button Suuraa Xinneessu -->
    <button id="compressBtn">Suuraa Xinneessi</button>
    
    <!-- Suuraa Xinneeffame Agarsiisuu -->
    <img id="compressedImage" alt="Compressed Image">
    
    <!-- Button Suuraa Buufachuu -->
    <a id="downloadLink" download="compressed_image.jpg" style="display: none;">
        <button>Download</button>
    </a>
</div>

<script>
    const uploadInput = document.getElementById('uploadImage');
    const compressBtn = document.getElementById('compressBtn');
    const compressedImg = document.getElementById('compressedImage');
    const downloadLink = document.getElementById('downloadLink');

    compressBtn.addEventListener('click', () => {
        const file = uploadInput.files[0];
        if (!file) {
            alert("Maaloo, dura suuraa filadhu!");
            return;
        }

        const reader = new FileReader();
        reader.readAsDataURL(file);
        
        reader.onload = function(event) {
            const img = new Image();
            img.src = event.target.result;
            
            img.onload = function() {
                // Canvas uumuu
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // Saayizii suuraa sirreessuu (fakkeenyaaf, 800px qofa gochuu)
                const MAX_WIDTH = 800;
                let width = img.width;
                let height = img.height;
                
                if (width > MAX_WIDTH) {
                    height *= MAX_WIDTH / width;
                    width = MAX_WIDTH;
                }
                
                canvas.width = width;
                canvas.height = height;
                
                // Suuraa canvas irratti kaasu
                ctx.drawImage(img, 0, 0, width, height);
                
                // Qulqullina suuraa (Quality) hir'isuu (0.7 jechuun 70% dha)
                const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
                
                // Suuraa haaraa fi download link agarsiisuu
                compressedImg.src = compressedDataUrl;
                compressedImg.style.display = 'block';
                downloadLink.href = compressedDataUrl;
                downloadLink.style.display = 'block';
            }
        }
    });
</script>

</body>
</html>
